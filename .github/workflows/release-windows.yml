name: Release Windows installer

on:
  push:
    tags:
      - 'V*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (branch or tag) to build'
        required: true
        default: 'master'

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
      packages: read

    strategy:
      # Keep building the other architecture if one fails.
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
            image: ghcr.io/swi-prolog/swipl-mingw-build:latest
            mode: --win64-from-git
            builddir: build.win64
          - arch: arm64
            # ARM64 host tools run under Wine and need a native aarch64
            # kernel with 4K pages; GitHub's hosted arm runners provide this.
            runner: ubuntu-24.04-arm
            image: ghcr.io/swi-prolog/swipl-mingw-build-arm64:latest
            mode: --winarm64-from-git
            builddir: build.winarm64

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Resolve build ref
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=${{ inputs.ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull build image
        run: docker pull "${{ matrix.image }}"

      - name: Cross-build Windows installer
        run: |
          docker run --name swipl-build \
            --cap-add=SYS_PTRACE \
            --security-opt seccomp=unconfined \
            "${{ matrix.image }}" \
            "${{ matrix.mode }}" \
              https://github.com/${{ github.repository }}.git \
              "${{ steps.ref.outputs.ref }}"

      - name: Extract installer
        id: extract
        run: |
          mkdir -p out
          # docker cp <container>:<dir> - streams the directory as a tar
          # to stdout.  Extract only the installer to sidestep the
          # safety check that rejects escaping symlinks elsewhere in
          # the build tree.
          docker cp "swipl-build:/home/swipl/src/swipl-devel/${{ matrix.builddir }}" - | \
            tar -x -C out/ --strip-components=1 --wildcards \
                "${{ matrix.builddir }}/swipl-*-*.${{ matrix.arch }}.exe"
          docker rm swipl-build
          installer=$(ls out/swipl-*.${{ matrix.arch }}.exe 2>/dev/null | head -n1)
          if [ -z "$installer" ]; then
            echo "No installer produced" >&2
            ls -la out/ >&2
            exit 1
          fi
          echo "path=$installer" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$installer")" >> "$GITHUB_OUTPUT"
          sha256sum "$installer" | tee "$installer.sha256"

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.extract.outputs.name }}
          path: |
            ${{ steps.extract.outputs.path }}
            ${{ steps.extract.outputs.path }}.sha256

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/V')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ steps.extract.outputs.path }}
            ${{ steps.extract.outputs.path }}.sha256
